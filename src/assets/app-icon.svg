<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#226b67"/>
      <stop offset="1" stop-color="#143a3b"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ecea"/>
      <stop offset="0.18" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e9ecea"/>
      <stop offset="0.18" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3be6a"/>
      <stop offset="1" stop-color="#a8781f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#c98a12"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- book shadow -->
  <path d="M256 152 C 214 128 152 120 96 128 L 96 372 C 152 364 214 372 256 398 C 298 372 360 364 416 372 L 416 128 C 360 120 298 128 256 152 Z" fill="#0b2526" opacity="0.35" transform="translate(0 14)"/>
  <!-- left page -->
  <path d="M256 150 C 214 124 152 116 96 124 L 96 368 C 152 360 214 368 256 394 Z" fill="url(#pageL)"/>
  <!-- right page -->
  <path d="M256 150 C 298 124 360 116 416 124 L 416 368 C 360 360 298 368 256 394 Z" fill="url(#pageR)"/>
  <!-- ruled ledger lines (right page) -->
  <g stroke="#2b8580" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M290 186 C 322 172 356 168 384 170"/>
    <path d="M290 228 C 322 214 356 210 384 212"/>
    <path d="M290 270 C 322 256 356 252 384 254"/>
    <path d="M290 312 C 322 298 356 294 384 296"/>
  </g>
  <!-- left page: ascending bars (sales) -->
  <g fill="#1f6b68">
    <rect x="132" y="262" width="22" height="58" rx="5"/>
    <rect x="166" y="232" width="22" height="90" rx="5"/>
    <rect x="200" y="200" width="22" height="124" rx="5"/>
  </g>
  <!-- spine -->
  <path d="M256 150 L 256 394" stroke="#c9d1cf" stroke-width="4"/>
  <!-- brass ribbon bookmark -->
  <path d="M240 128 L 272 128 L 272 450 L 256 432 L 240 450 Z" fill="url(#brass)"/>
  <!-- PRO badge (Smart Ledger Pro) -->
  <g>
    <rect x="292" y="22" width="200" height="96" rx="48" fill="#0b2526" opacity="0.35" transform="translate(0 6)"/>
    <rect x="292" y="22" width="200" height="96" rx="48" fill="url(#gold)" stroke="#fff6d8" stroke-width="6"/>
    <text x="392" y="91" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, DejaVu Sans, sans-serif" font-weight="900" font-size="66" letter-spacing="2" fill="#143a3b">PRO</text>
  </g>
</svg>
